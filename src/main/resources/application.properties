spring.application.name=EcoQuestAPI
server.port=8080

# ==========================================
# Configuração do Banco de Dados Oracle (FIAP)
# ==========================================
spring.datasource.url=${ORACLE_URL}
spring.datasource.username=${ORACLE_USERNAME}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Evita o Warning do Open Session in View
spring.jpa.open-in-view=false

# Garante que o Spring respeite os nomes exatos das tabelas do Oracle
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy